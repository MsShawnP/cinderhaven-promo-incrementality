name: CI

# The truth gate runs on every push from the first commit that could contain an
# estimator, not added later when convenient. See CLAUDE.md.
on:
  push:
  pull_request:

# Read-only. The workflow clones a private sibling repo via a fine-grained PAT
# held in the PROMO_RESPONSE_READ secret (Contents + Metadata, read-only
# on cinderhaven-promo-response). Nothing here writes anywhere.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, with the version in a
# trailing comment. A tag like @v7 is mutable — whoever controls the action repo
# can move it to different code, and this workflow holds a private-repo read
# token and deploy credentials. The SHA freezes exactly what runs; bump the SHA
# and the comment together (Dependabot understands this form). npx pins its own
# tools by npm major (wrangler@4) and is not covered here.
jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — the truth gate. Pure AST parsing over src/. No data, by design.
  #
  # Deliberately installed with --no-deps: the gate module imports only `ast`
  # and `pathlib`, so pandas/numpy/pyarrow are never needed here. A gate that
  # can go red because a wheel failed to resolve is a gate people learn to
  # ignore, and this one is the credibility of the accuracy view.
  #
  # This job must stay green. If it is red, estimation code can reach truth.
  # ---------------------------------------------------------------------------
  truth-gate:
    name: Truth gate (AST, no data)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Confirm the read token is present
        # An absent secret expands to an empty string, producing
        # `https://x-access-token:@github.com/` and a git error that reads
        # "Invalid username or token" — which looks like a bad PAT rather than
        # a missing one. Cost: one wasted debugging cycle. This fails early and
        # says which repo the secret belongs on. The value is never echoed.
        env:
          TOKEN: ${{ secrets.PROMO_RESPONSE_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PROMO_RESPONSE_READ is not set on this repository."
            echo "::error::It must exist in the Actions secrets of the repo that RUNS this workflow"
            echo "::error::(cinderhaven-promo-incrementality), not the repo it reads"
            echo "::error::(cinderhaven-promo-response). A secret on the upstream repo is not visible here."
            exit 1
          fi
          echo "token present"

      - name: Authenticate to the private data package
        # Rewrites the plain https URL in pyproject.toml at git level, so the
        # manifest never contains a credential and the pinned SHA stays the
        # single source of truth. The token is not echoed.
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.PROMO_RESPONSE_READ }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install the gate only
        # The requirement string is read out of pyproject.toml rather than
        # repeated here. Duplicating a pinned SHA across two files is the drift
        # this project's pin decision exists to prevent.
        run: |
          python -m pip install --upgrade pip
          DEP=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'][0])")
          python -m pip install --no-deps "$DEP"
          python -m pip install pytest

      - name: Confirm the gate imported without its data layer
        # If pandas is present, --no-deps silently stopped meaning anything and
        # this job is no longer the fast, isolated gate it claims to be.
        run: |
          python - <<'PY'
          import importlib.util, sys
          from cinderhaven_promo_response.testing import assert_no_truth_access  # noqa: F401
          assert importlib.util.find_spec("pandas") is None, (
              "pandas is installed in the gate job; --no-deps is not doing what "
              "this job's design assumes"
          )
          print("gate imported clean; pandas absent as intended")
          PY

      - name: Run the truth gate and the generator-import ban
        # Both are AST-only and dependency-light. The import ban closes the
        # hole the truth gate leaves open: it denies `truth`, this denies
        # `config`/`constants` (the response coefficients and the demand
        # generator) — the answer key by another route.
        run: python -m pytest tests/test_truth_gate.py tests/test_import_ban.py -v

  # ---------------------------------------------------------------------------
  # Job 2 — the data contract. Installs the pinned package and calls pr.load().
  #
  # Green since the pin moved to v0.1.1 (7cfe95c). Under v0.1.0 this was red on
  # every run: pr.load() raised FileNotFoundError on the first call because the
  # consumer serve path read FIGURES.md, a source file absent from the wheel,
  # and CI is a cold cache every run. The upstream packaging fix removed it. The
  # job asserts the contract — 131 events, 1,340,462 rows, eight observed
  # columns — and that the install resolves to the pinned SHA.
  #
  # No continue-on-error, and it should stay that way: if this goes red again it
  # means the upstream data or its packaging changed under the pin, which is
  # exactly the signal worth failing on.
  # ---------------------------------------------------------------------------
  data-contract:
    name: Data contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Confirm the read token is present
        # An absent secret expands to an empty string, producing
        # `https://x-access-token:@github.com/` and a git error that reads
        # "Invalid username or token" — which looks like a bad PAT rather than
        # a missing one. Cost: one wasted debugging cycle. This fails early and
        # says which repo the secret belongs on. The value is never echoed.
        env:
          TOKEN: ${{ secrets.PROMO_RESPONSE_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PROMO_RESPONSE_READ is not set on this repository."
            echo "::error::It must exist in the Actions secrets of the repo that RUNS this workflow"
            echo "::error::(cinderhaven-promo-incrementality), not the repo it reads"
            echo "::error::(cinderhaven-promo-response). A secret on the upstream repo is not visible here."
            exit 1
          fi
          echo "token present"

      - name: Authenticate to the private data package
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.PROMO_RESPONSE_READ }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install with the pinned dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Confirm the installed package resolves to the pinned SHA
        # pip records provenance in direct_url.json; this checks the pin took
        # effect rather than trusting that it did. The manifest stays the only
        # place the SHA is written.
        run: |
          python - <<'PY'
          import json, tomllib
          from importlib.metadata import Distribution

          requirement = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"][0]
          expected = requirement.rsplit("@", 1)[-1].strip()

          provenance = json.loads(
              Distribution.from_name("cinderhaven-promo-response").read_text("direct_url.json")
          )
          found = provenance["vcs_info"]["commit_id"]

          assert found == expected, f"installed {found}, manifest pins {expected}"
          print(f"pin verified: {found}")
          PY

      - name: Run the data contract tests
        run: python -m pytest tests/test_data_contract.py -v

  # ---------------------------------------------------------------------------
  # Job 3 — deploy the static site to Cloudflare Pages.
  #
  # Path B (see DECISIONS.md): the build runs HERE, not in Cloudflare's build
  # container. The pipeline must `pip install` the private upstream package,
  # and this is the one environment where that credential already works
  # (PROMO_RESPONSE_READ). Cloudflare receives only finished static files via
  # wrangler, so the token never has to be replicated into a Pages build env.
  #
  # Runs only on push to main — never on PRs (a fork PR must not deploy) and
  # never unless the truth gate and the data contract are green. A deploy that
  # could ship while estimation code can reach truth is exactly the thing the
  # gate exists to prevent.
  # ---------------------------------------------------------------------------
  # Build the static site (Python pipeline first, then SvelteKit) and hand it to
  # the org reusable deploy workflow as an artifact. Runs only on push to main —
  # never on PRs (a fork PR must not deploy) and never unless the truth gate and
  # the data contract are green. Cloudflare credentials live in the reusable
  # deploy job, not here; this job only needs the private-package read token.
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [truth-gate, data-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Confirm the read token is present
        # The pipeline pip-installs the private package, which needs this. Fail
        # early and clearly rather than deep in a pip clone error.
        env:
          TOKEN: ${{ secrets.PROMO_RESPONSE_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PROMO_RESPONSE_READ is not set on this repository."
            exit 1
          fi
          echo "token present"

      - name: Authenticate to the private data package
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.PROMO_RESPONSE_READ }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install the pipeline (pinned upstream package)
        # No dev extras — deploy does not run pytest. `-e .` installs this
        # package so `python -m incrementality.build_skeleton` resolves, and
        # pulls the pinned private dependency the pipeline loads.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install front-end dependencies
        run: npm --prefix web ci

      - name: Build the static site (pipeline first)
        # scripts/build.sh runs the Python pipeline, then the SvelteKit build,
        # with set -e — a pipeline failure aborts before anything is deployed,
        # so a stale or missing artifact never ships.
        run: bash scripts/build.sh

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: web/build

  # Deploy via the org reusable workflow, pinned to @v1 (the versioned contract —
  # never @main). Project name is passed EXPLICITLY so the repo name never lands
  # on the *.pages.dev URL. secrets: inherit passes the org-level CLOUDFLARE_*
  # secrets through. Skips whenever the build job skips (PRs, non-main pushes),
  # so a fork PR still never deploys.
  deploy:
    name: Deploy
    needs: [build]
    uses: lailarallc/reusable-workflows/.github/workflows/pages-deploy.yml@v1
    with:
      project_name: cinderhaven-promo-incrementality
      artifact_name: site
    secrets: inherit
