<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Site-wide invariants only. Per-page tags (page title, description,
		     canonical link, og:title, og:description) live in each route's
		     svelte:head block. They must NOT be repeated here: this block renders
		     before the SvelteKit head placeholder, so a page title set here would
		     win and silently kill every route title, and a canonical link here
		     would claim the site root on every page.

		     og:image is site-wide and absolute: scrapers do not resolve relative
		     URLs, and they cache the image aggressively, so the card deliberately
		     carries no figure — a number baked into it would be served stale from
		     a scraper's cache long after a re-pin moved it. Source of truth for the
		     PNG is web/card-source/card.html. -->
		<meta property="og:site_name" content="Lailara LLC" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://liftmath.lailarallc.com/og-card.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Lift Math — trade-promotion incrementality, scored against known truth. Lailara LLC."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://liftmath.lailarallc.com/og-card.png" />

		<!-- Vendored Lailara brand frame (tokens, self-hosted fonts, page shell).
		     Never live-linked — see web/static/lailara/. -->
		<link rel="stylesheet" href="/lailara/lailara-frame.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
