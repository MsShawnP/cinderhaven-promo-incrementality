  Source of truth for web/static/og-card.png (1200x630).

  Rendered as HTML rather than drawn in an image library so the card uses the
  REAL brand assets: the vendored Playfair Display / Source Sans 3 woff2 files
  and the same palette tokens as the site. That also means no new Python
  dependency (Pillow) and no headless-browser dependency in CI.

  Self-contained: the three brand woff2 faces are inlined as base64, so this
  file renders identically with no server and no network. To re-shoot, open it
  directly at a 1200x630 viewport, screenshot, and save over
  web/static/og-card.png. (vite preview will not serve a stray .html from the
  adapter-static output, which is why this does not depend on it.)

  DELIBERATELY CARRIES NO FIGURE. Scrapers cache og:image aggressively and for
  a long time, so a number baked in here would be served stale from LinkedIn's
  cache long after a re-pin moved it — the artifact-fed guarantee the rest of
  the site relies on does not reach this surface. The count also differs by
  method (Method 0 and Method 1 disagree), so a bare number on a card would be
  ambiguous about which one it is. Identity and the durable claim instead.
-->
