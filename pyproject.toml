[project]
name = "cinderhaven-promo-incrementality"
version = "0.0.1"
description = "Trade-promotion incrementality tool: ROI Scorecard, Event Anatomy, and an estimate-vs-truth Accuracy view over the Cinderhaven promo-event spine"
readme = "README.md"
requires-python = ">=3.11"

# The pin is the SHA, not the tag. Annotated tags are mutable; a tag name
# would let the dependency change under a manifest that still reads as
# pinned. An accuracy number is meaningless without knowing which data
# generation it scored against — see DECISIONS.md.
#
# 6556460 = v0.3.0, adds store_card() — per-store identity (retailer_id, region,
# store_format), the accessor Method 1's comparable-store matching consumes. Same
# demarcation as economics(): identity a client hands a vendor, not demand
# response. Data-neutral for the observed layer — 131 events / 1,340,462 rows /
# the eight observed columns are unchanged; store_card() is additive. Re-pin
# logged as a re-run in DECISIONS.md. Resolve with `git rev-parse v0.3.0^{commit}`
# — NOT `git rev-parse v0.3.0`, which returns the annotated tag object.
dependencies = [
    "cinderhaven-promo-response @ git+https://github.com/MsShawnP/cinderhaven-promo-response@6556460000d56fd2df1c89c59f592f363b93245c",
]

# Local iteration off a working tree is a hand-run command, never a manifest
# entry:  pip install -e ../cinderhaven-promo-response
# Putting that path here would make "pinned at v0.2.1" describe this machine
# rather than anything CI can reproduce.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
