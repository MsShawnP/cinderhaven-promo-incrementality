[project]
name = "cinderhaven-promo-incrementality"
version = "0.0.1"
description = "Trade-promotion incrementality tool: ROI Scorecard, Event Anatomy, and an estimate-vs-truth Accuracy view over the Cinderhaven promo-event spine"
readme = "README.md"
requires-python = ">=3.11"

# The pin is the SHA, not the tag. Annotated tags are mutable; a tag name
# would let the dependency change under a manifest that still reads as
# pinned. An accuracy number is meaningless without knowing which data
# generation it scored against — see DECISIONS.md.
#
# 11caa13 = v0.2.1, "release 0.2.1: economics() imports pandas lazily". This is
# v0.2.0 (economics() accessor) plus the fix for a regression that version
# introduced — importing the package pulled pandas, which broke the --no-deps
# truth-gate job. v0.2.0 was never pinned in a shipped state; go straight to
# v0.2.1. Data-neutral: 131 events / 1,340,462 rows / the eight observed columns
# are unchanged. Resolve with `git rev-parse v0.2.1^{commit}` — NOT
# `git rev-parse v0.2.1`, which returns the annotated tag object. See DECISIONS.md.
dependencies = [
    "cinderhaven-promo-response @ git+https://github.com/MsShawnP/cinderhaven-promo-response@11caa13e232b0a7dc76ae02126932fdc4dfb6026",
]

# Local iteration off a working tree is a hand-run command, never a manifest
# entry:  pip install -e ../cinderhaven-promo-response
# Putting that path here would make "pinned at v0.2.1" describe this machine
# rather than anything CI can reproduce.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
