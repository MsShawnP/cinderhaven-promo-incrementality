[project]
name = "cinderhaven-promo-incrementality"
version = "0.0.1"
description = "Trade-promotion incrementality tool: ROI Scorecard, Event Anatomy, and an estimate-vs-truth Accuracy view over the Cinderhaven promo-event spine"
readme = "README.md"
requires-python = ">=3.11"

# The pin is the SHA, not the tag. Annotated tags are mutable; a tag name
# would let the dependency change under a manifest that still reads as
# pinned. An accuracy number is meaningless without knowing which data
# generation it scored against — see DECISIONS.md.
#
# eefe9a4 = v0.2.0, "release 0.2.0: economics() price-card accessor". Re-pinned
# 2026-08-19 from 7cfe95c (v0.1.1) to reach economics() — the demand-free
# per-SKU COGS + per-SKU×retailer wholesale/unit margin the Method 0 ROI needs.
# Data-neutral: v0.2.0 regenerates nothing; 131 events / 1,340,462 rows / the
# eight observed columns are unchanged. Resolve with
# `git rev-parse v0.2.0^{commit}` — NOT `git rev-parse v0.2.0`, which returns
# the annotated tag object (bea1982), not a commit. See DECISIONS.md.
dependencies = [
    "cinderhaven-promo-response @ git+https://github.com/MsShawnP/cinderhaven-promo-response@eefe9a43ec4496bb3bb58440829b95843dbc1e96",
]

# Local iteration off a working tree is a hand-run command, never a manifest
# entry:  pip install -e ../cinderhaven-promo-response
# Putting that path here would make "pinned at v0.2.0" describe this machine
# rather than anything CI can reproduce.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
