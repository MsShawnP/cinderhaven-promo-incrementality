[project]
name = "cinderhaven-promo-incrementality"
version = "0.0.1"
description = "Trade-promotion incrementality tool: ROI Scorecard, Event Anatomy, and an estimate-vs-truth Accuracy view over the Cinderhaven promo-event spine"
readme = "README.md"
requires-python = ">=3.11"

# The pin is the SHA, not the tag. Annotated tags are mutable; a tag name
# would let the dependency change under a manifest that still reads as
# pinned. An accuracy number is meaningless without knowing which data
# generation it scored against — see DECISIONS.md.
#
# 7cfe95c = v0.1.1, "release 0.1.1: fix pr.load() crash on first call in a
# fresh install". Re-pinned 2026-08-18 from 70021d4 (v0.1.0), whose pr.load()
# raised FileNotFoundError on the first call in any fresh install — the upstream
# packaging fix. Data-neutral: v0.1.1 is byte-for-byte the v0.1.0 data. Recorded
# here for humans; resolve with `git rev-parse v0.1.1^{commit}` in the upstream
# repo, not `git rev-parse v0.1.1` — that returns the annotated tag object
# (e8439fb), not a commit. See DECISIONS.md and FAILURES.md.
dependencies = [
    "cinderhaven-promo-response @ git+https://github.com/MsShawnP/cinderhaven-promo-response@7cfe95c8e014bc7dec30801efbf27b6d27418f3b",
]

# Local iteration off a working tree is a hand-run command, never a manifest
# entry:  pip install -e ../cinderhaven-promo-response
# Putting that path here would make "pinned at v0.1.1" describe this machine
# rather than anything CI can reproduce.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
